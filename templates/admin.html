{% extends "base.html" %}
{% block title %}后台管理{% endblock %}
{% block content %}
<div class="admin-bar">
  <h2>文章管理</h2>
  <a class="btn" href="{{ url_for('write') }}">+ 写新文章</a>
  <a class="btn ghost" href="{{ url_for('admin_tags') }}">🏷️ 标签管理</a>
  <a class="btn ghost" href="{{ url_for('admin_settings') }}">⚙️ 站点设置</a>
</div>
<table class="admin-table">
  <tr><th>标题</th><th>浏览</th><th>发布时间</th><th>操作</th></tr>
  {% for post in posts %}
  <tr>
    <td><a href="{{ url_for('post_detail', slug=post['slug']) }}">{{ post['title'] }}</a></td>
    <td>{{ post['views'] }}</td>
    <td>{{ post['created_at'][:16] }}</td>
    <td class="actions">
      <a class="btn small" href="{{ url_for('edit', post_id=post['id']) }}">编辑</a>
      <form method="post" action="{{ url_for('delete', post_id=post['id']) }}" onsubmit="return confirm('确定删除？')">
        <button class="btn small danger" type="submit">删除</button>
      </form>
    </td>
  </tr>
  {% else %}
  <tr><td colspan="4" class="empty">还没有文章</td></tr>
  {% endfor %}
</table>
{% endblock %}
